# The IKEA products this package serves, and the models they are drawn with.
#
# A product is listed here only when a model of it can be found in one of
# PartCAD's model-site collections, //pub/collection/<site>: that is the whole
# rule of this catalog. Each product is served by ikea_repo.py as a part of
# type 'alias' of one of its models - the first one whose site is in the
# plugin's 'sources' - in the IKEA category package it belongs to.
#
# What IKEA says about a product (its name, type, size, colour, article number
# and page) is from ikea.com's own product search, for the Netherlands in
# English (nl/en): metric, in English, and in European bed sizes.
# tools/check_catalog.py asks IKEA and the model sites again and says what no
# longer agrees.
#
# Every model is placed the same way, so that a scene can put a product against
# a wall without knowing whose model it is: millimetres, Z up, the width along
# X, the middle of its back edge at the origin on the floor, and its front
# facing -Y. A model drawn otherwise - lying on its back to be 3D-printed,
# upside down, in metres, or a scale model - is brought there by the alias's
# 'offset' (a rotation about the origin, then a translation, in the model's own
# units) and 'scale' (applied after it), as PartCAD applies them to any
# reference. tools/fit_offset.py works the offset out from the model's bounding
# box. A model whose geometry could not be fetched to be measured - a GrabCAD
# file needs a GrabCAD sign-in - is served as its designer drew it, and says so
# ('placed: as-drawn').
#
# A model entry:
#
#   site:    the collection: printables, makerworld, grabcad, thingiverse or cults3d
#   model:   the model's number (its slug on GrabCAD), as in the site's URL
#   file:    which of its files, as the collection's plugin names one ('file=')
#   title, author, license: as the site states them
#   scale, offset: as above
#   placed:  'measured' (its geometry was fetched and fitted to the convention)
#            or 'as-drawn' (only its file list was seen)
#   note:    anything a user should know about how true to the product it is

# IKEA's own categories, in the order ikea.com shows them, each with the key
# ikea.com knows it by. A product is in the category whose path it names.
